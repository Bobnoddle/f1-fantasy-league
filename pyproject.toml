[project]
name = "f1-fantasy"
version = "1.0.0"
description = "F1 Fantasy League — web app with Discord webhook output"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET"]
ignore = ["N802", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Tests and Protocol implementations legitimately ignore unused parameters —
# fakes must match a Protocol's signature even when they ignore the arguments.
"tests/*" = ["ARG", "S101"]
# FastAPI's dependency-injection idiom is Depends() in argument defaults.
"app/web/*" = ["B008"]
"app/services/*" = ["ARG"]
"app/repo/*" = ["ARG"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicit, because flat-layout auto-discovery errors out on this repo: the
# legacy tree leaves api/, cogs/, db/ and utils/ sitting beside app/, and
# `pip install -e .` refuses to guess which one is the package.
include = ["app*"]
namespaces = false